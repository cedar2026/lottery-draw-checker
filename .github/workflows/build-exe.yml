# 打包 Windows exe：打上 v* 标签（或手动触发）后自动构建，
# 三个 exe 附到对应 Release 上，小白下载双击就能用，不用装 Python。
name: 打包 exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包三个 exe
        run: |
          pyinstaller --onefile --noconsole --name lottery_checker server/lottery_checker.pyw
          pyinstaller --onefile --noconsole --name lottery_checker_personal personal/lottery_checker_personal.pyw
          pyinstaller --onefile --name lottery_cli agent/lottery_cli.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
